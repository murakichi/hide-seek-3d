name: CI

on:
  # 既定の types は opened / synchronize / reopened だけなので、draft を ready に
  # しても走らない。draft のまま作られた PR は、ready にした時点で一度も測られて
  # いない状態になる（実際 #53 と #55 が CI 無しで並んでいた）。
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 型チェックとビルド
        run: npm run build

      # 対戦が異常終了しないことだけを見る。勝率は winrate.yml が
      # master との差分つきで測ってコメントする。
      - name: ヘッドレス対戦の疎通
        run: npm run sim -- --games 2 --hiders 2 --seekers 2
