name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 型チェックとビルド
        run: npm run build

      # 対戦が異常終了しないことだけを見る。勝率は winrate.yml が
      # master との差分つきで測ってコメントする。
      - name: ヘッドレス対戦の疎通
        run: npm run sim -- --games 2 --hiders 2 --seekers 2
